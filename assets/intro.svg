<svg width="820" height="220" viewBox="0 0 820 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">This is Diego</title>
  <desc id="description">Diego is a software engineer who designs and builds SaaS products.</desc>
  <style>
    .card { fill: #ffffff; stroke: #e5e5e5; }
    .heading { fill: #171717; }
    .body { fill: #525252; }
    .rule { stroke: #d4d4d4; }
    .cursor { fill: #737373; animation: blink .8s steps(1) infinite; }
    .reveal { opacity: 0; animation: reveal 8s ease-in-out infinite; }
    .line-1 { animation-delay: .3s; }
    .line-2 { animation-delay: 1.05s; }
    .line-3 { animation-delay: 1.8s; }
    @keyframes reveal {
      0%, 4% { opacity: 0; transform: translateY(3px); }
      11%, 88% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; }
    }
    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0a0a0a; stroke: #262626; }
      .heading { fill: #fafafa; }
      .body { fill: #d4d4d4; }
      .rule { stroke: #404040; }
      .cursor { fill: #a3a3a3; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; animation: none; }
      .cursor { display: none; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="819" height="219" rx="12"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g class="reveal line-1">
      <text class="heading" x="34" y="52" font-size="18" font-weight="600">This is Diego</text>
    </g>
    <g class="reveal line-2">
      <text class="body" x="34" y="96" font-size="15">I'm a software engineer who designs, and a design engineer who builds.</text>
    </g>
    <g class="reveal line-3">
      <line class="rule" x1="35" y1="126" x2="35" y2="160" stroke-width="2"/>
      <text class="body" x="51" y="148" font-size="15" font-style="italic">Building SaaS products and turning ideas into tech businesses.</text>
      <rect class="cursor" x="500" y="134" width="2" height="18" rx="1"/>
    </g>
  </g>
</svg>
